[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyecoregen"
version = "0.5.1"
description = "Model to text framework for PyEcore, including the Ecore to Python generator"
readme = "README.rst"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Mike Pagel", email = "mike@mpagel.de"}]
dependencies = ["pyecore", "pymultigen", "jinja2>=3.1.6", "autopep8>=2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/pyecore/pyecoregen"

[project.scripts]
pyecoregen = "pyecoregen.cli:main"

[project.optional-dependencies]
test = ["pytest>=9.0.3"]

[tool.setuptools.packages.find]
include = ["pyecoregen*"]

[tool.setuptools.package-data]
pyecoregen = ["templates/*"]
